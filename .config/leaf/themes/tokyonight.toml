# leaf の TokyoNight (night) テーマ
# リンク先: ~/.config/leaf/themes/tokyonight.toml (bin/link.sh)
# config.toml の theme = "tokyonight" で選択する。
#
# Ghostty の theme = TokyoNight と揃えるための配色。
# 色指定の全項目は upstream の gruvbox.toml を参照:
#   https://github.com/RivoLink/leaf/blob/main/gruvbox.toml
#
# TokyoNight palette (folke/tokyonight.nvim の night):
#   bg #1a1b26 / bg_dark #16161e / bg_highlight #292e42 / fg_gutter #3b4261
#   fg #c0caf5 / fg_dark #a9b1d6 / comment #565f89 / dark5 #737aa2
#   blue #7aa2f7 / cyan #7dcfff / magenta #bb9af7 / orange #ff9e64
#   yellow #e0af68 / green #9ece6a / teal #73daca / red #f7768e

base = "ocean"
# leaf が同梱する syntect テーマから, 暗色背景に馴染むものを使う
syntax = "base16-ocean.dark"

[ui]
toc_bg = "#16161e"
toc_border = "#3b4261"
content_bg = "#1a1b26"
scrollbar_hover = "#7aa2f7"
status_bg = "#16161e"
status_separator = "#565f89"
status_brand_fg = "#1a1b26"
status_brand_bg = "#7aa2f7"
status_filename_fg = "#c0caf5"
status_filename_bg = "#292e42"
status_watch_fg = "#9ece6a"
status_watch_bg = "#1f2d23"
status_reloaded_fg = "#1a1b26"
status_reloaded_bg = "#9ece6a"
status_search_fg = "#e0af68"
status_search_bg = "#292e42"
status_success_fg = "#9ece6a"
status_success_bg = "#1f2d23"
status_warning_fg = "#e0af68"
status_error_fg = "#f7768e"
status_error_bg = "#37222c"
status_shortcut_fg = "#565f89"
status_percent_fg = "#7aa2f7"
status_dot_fg = "#565f89"
toc_hover_fg = "#c0caf5"
toc_header_fg = "#565f89"
toc_active_bg = "#292e42"
toc_inactive_bg = "#16161e"
toc_accent = "#7aa2f7"
toc_index_inactive = "#3b4261"
toc_primary_active = "#c0caf5"
toc_primary_inactive = "#a9b1d6"
toc_secondary_inactive = "#3b4261"
toc_secondary_text_active = "#a9b1d6"
toc_secondary_text_inactive = "#737aa2"

[markdown]
search_highlight_bg = "#3d59a1"
search_match_bg = "#e0af68"
code_gutter = "#3b4261"
blockquote_marker = "#565f89"
list_level_1 = "#7aa2f7"
