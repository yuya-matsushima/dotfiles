list_level_3 = "#73daca"
ordered_list = "#ff9e64"
table_border = "#3b4261"
table_separator = "#292e42"
table_header = "#7dcfff"
table_cell = "#c0caf5"
heading_1 = "#7aa2f7"
heading_2 = "#bb9af7"
heading_3 = "#7dcfff"
heading_4 = "#9ece6a"
heading_other = "#e0af68"
heading_underline = "#3b4261"
code_frame = "#3b4261"
code_label = "#565f89"
inline_code_fg = "#ff9e64"
inline_code_bg = "#292e42"
rule = "#3b4261"
link_icon = "#7dcfff"
link_text = "#7dcfff"
link_hover = "#b4f9f8"
blockquote_text = "#a9b1d6"
text = "#c0caf5"
strong_text = "#ffffff"
latex_inline_fg = "#bb9af7"
latex_inline_bg = "#292e42"
latex_block_fg = "#bb9af7"
mermaid_keyword = "#ff9e64"
mermaid_arrow = "#7dcfff"
mermaid_label = "#9ece6a"
mermaid_block_fg = "#c0caf5"
mark_fg = "#1a1b26"
mark_bg = "#e0af68"
task_checked = "#9ece6a"
