# hypr-fcitx-sync の設定
# スクリプト本体: ~/.local/bin/hypr-fcitx-sync
#
# アプリ未指定時の既定: keep | ja | en
#   keep = 現在の状態を維持したまま同期 (再活性化) だけ行う。方針は押し付けない。
#   ja/en = 未設定アプリを日本語/英語に固定する (手動トグルを上書きしうるので注意)
default = keep
# 同期方法: cycle | reassert | none
#   cycle = 日本語ON のとき一度 off -> on して取りこぼした活性化を復活させる
#   reassert = 現在の状態をそのまま再送 (状態を変えない安全側)
#   none = モードの適用のみ
heal = cycle

# アプリ個別指定 (任意)。ウィンドウ CLASS 単位。
# 例:
# foot = ja
# chromium = en