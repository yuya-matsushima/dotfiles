## Apple T2 audio: prefer larger buffers.
##
## The t2bce_audio driver exposes its PCMs with period_size=1 and a large
## buffer, and the 4-channel internal speaker path underruns with the default
## 256-sample quantum (audible crackling, ERR counters climbing in pw-top).
## Pin the graph to a larger quantum; 1024/48000 is about 21 ms.

context.properties = {
  default.clock.quantum = 1024
  default.clock.min-quantum = 1024
  default.clock.max-quantum = 4096
}
