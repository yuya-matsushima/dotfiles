## Apple T2 audio: keep the analog PCMs open across jack changes and skip the
## split loopback for the internal speakers.
##
## t2bce_audio exposes speakers (hw:0,0, 4ch) and headphones (hw:0,2, 2ch) as
## separate PCMs. WirePlumber's ALSA split puts a hidden hw node plus a loopback
## in front of the speakers; after a jack change those links fail to activate
## ("link failed: 2 of 2 PipeWire links failed to activate") and streams can no
## longer be linked to the speaker sink, so unplugging the headphones leaves
## playback silent even though the default sink switches to the speakers.
## Using the ALSA node directly removes that loopback from the path.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_e6_00.3.*" }
      { node.name = "~alsa_input.pci-0000_e6_00.3.*" }
      { node.name = "~alsa_output.hw_Audio.*" }
      { node.name = "~alsa_input.hw_Audio.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card.pci-0000_e6_00.3" }
    ]
    actions = {
      update-props = {
        api.alsa.split-enable = false
      }
    }
  }
]
