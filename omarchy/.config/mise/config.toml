[settings]
# asdf の legacy_version_file = yes 相当 + ASDF_GOLANG_MOD_VERSION_ENABLED 相当
# .nvmrc / .node-version / .ruby-version / .python-version / go.mod を mise に読ませる設定。
# .tool-versions と mise.toml は mise が標準で読むため、この設定とは無関係 (.tool-versions が無くなっても消せない)。
# 削除できるのは、該当ファイルを使うプロジェクトがなくなった (mise.toml / .tool-versions に統一した) とき。
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "go"]

[tools]
# node は LTS、それ以外は最新版を使う。kube 系は未使用のため宣言しない
node = "lts"
pnpm = "latest"
ruby = "latest"
python = "latest"
# uv (Python パッケージマネージャ) はリリース頻度が高いため mise で管理
uv = "latest"
go = "latest"
golangci-lint = "latest"
rust = "latest"
aws-cli = "latest"
gcloud = "latest"
aws-sam = "latest"
terraform = "latest"
tflint = "latest"
# OpenCode は npm 配布の V2 を使う。GitHub Releases / registry の aqua 版
# (anomalyco/opencode) は V1 系 (最新 v1.19.0) のため宣言しない。
# `opencode` / `opencode2` の両バイナリが入る。
# mise は既定で npm の lifecycle script を実行しないが, 本体バイナリの配置は postinstall が
# 担うため許可する (未実行だと `opencode` がプレースホルダのままエラー終了する)。
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
# global npm パッケージ (旧: asdf node lts への npm i -g)
# @github/copilot は Homebrew cask copilot-cli に一本化
"npm:ccusage" = "latest"
"npm:@mermaid-lint/cli" = "latest"

# user scope の agent skill 管理。manifest と script は ~/.config/skills に link される。
# グローバル設定なので $HOME を含む任意のディレクトリから実行できる。
[tasks.skills]
description = "宣言どおりに user scope の skill を install / 更新する"
run = "sh \"$HOME/.config/skills/skills.sh\""

[tasks."skills:check"]
description = "宣言とインストール済み skill の差分を表示する"
run = "sh \"$HOME/.config/skills/skills.sh\" --check"

[tasks."skills:force"]
description = "宣言済み skill を強制再 install する (上流で消えたファイルの掃除)"
run = "sh \"$HOME/.config/skills/skills.sh\" --force"

[tasks."skills:prune"]
description = "宣言に無い gh 管理 skill を削除する (確認あり)"
run = "sh \"$HOME/.config/skills/skills.sh\" --prune"
