# Voxtype Configuration (Linux / Omarchy 専用)
#
# 日本語の口述をカーソル位置へ直接入力するための設定。
# キーバインドは compositor (Hyprland) 側で定義するため hotkey.enabled = false。
# Omarchy 4.5 の既定の割り当て:
#   F9 / 右 Alt 押している間 = push-to-talk / SUPER + CTRL + X = トグル
#   SUPER + CTRL + ESCAPE = 録音・書き起こしのキャンセル (dotfiles 側で追加)
#
# 状態ファイルは `voxtype record toggle` / `voxtype status` に必要 (auto = $XDG_RUNTIME_DIR/voxtype/state)
state_file = "auto"

[hotkey]
# evdev を直接監視しない (input グループへの追加が不要)。
# compositor のキーバインドから `voxtype record` を叩く構成にする。
enabled = false

[audio]
# "default" でシステム既定の入力 (T2 内蔵マイク) に追従する
device = "default"

# サンプルレート (whisper は 16000 Hz 前提)
sample_rate = 16000

# 長めの口述でも途中で切れないよう既定の 60 秒から延長する
max_duration_secs = 120

# 録音中は MPRIS の再生を一時停止する
pause_media = true

[audio.feedback]
# 録音中かどうかを耳で判断できるよう開始 / 終了の効果音を鳴らす
enabled = true
theme = "subtle"
volume = 0.6

[whisper]
# base.en は英語専用のため, 日本語も扱える多言語モデルを使う。
# 実測 (8 秒の日本語音声, AVX-512 / 4 スレッド):
#   base  = 1.6 秒 (通常の dictation 用)
#   small = 5.5 秒 (精度優先。SUPER + CTRL + SHIFT + X で明示指定)
# 録音ごとの指定は `voxtype record toggle --model small`。上書きしたモデルは
# デーモンが保持するため, 2 回目以降はロード待ちが無い。
model = "base"

# 日本語で口述する (英語の技術用語は混ざってよい)。
# 日英を切り替えて使う場合は "ja,en" のように制約付き自動判定も指定できる。
language = "ja"

# i5-1038NG7 は 4C/8T。8 スレッド指定しても速度は変わらず消費電力だけ増えたため 4 にする。
threads = 4

# 表記ゆれ・句読点を安定させるための bias。
# 固有名詞を増やすとその語の認識が良くなるが, 長すぎると出力がプロンプトに引っ張られる。
initial_prompt = "以下は日本語の技術的な口述です。句読点を適切に付け、英単語はアルファベットのまま表記します。用語: Hyprland、Neovim、TypeScript、GitHub、Omarchy、Voxtype、fcitx5、mozc。"

translate = false

[output]
# wtype 経由でカーソル位置に直接入力する (CJK 対応)。
# clipboard にしたい場合は mode = "clipboard" にする。
mode = "type"

# 入力に失敗した場合は消さずにクリップボードへ退避する
fallback_to_clipboard = true

# wtype で 1 文字目 (特に CJK) が落ちるアプリ向けに Shift を 1 回叩いてから入力する
wtype_shift_prefix = true

# SUPER + CTRL + X の解放が遅れても, 修飾キーが離れるまで入力を待つ
wait_for_modifier_release = true

[output.notification]
# 効果音で状態が分かるため, デスクトップ通知は出さない
on_recording_start = false
on_recording_stop = false
on_transcription = false

[vad]
# 無音や雑音だけの録音を書き起こさない。
# energy は追加モデル不要 (Silero を使う場合は backend = "whisper" + `voxtype setup vad`)。
enabled = true
backend = "energy"

# 内蔵マイクの入力レベルに合わせたしきい値。小さい声が落ちる場合は下げる。
threshold = 0.4
